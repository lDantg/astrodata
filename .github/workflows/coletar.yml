name: Coletar Astrocade

on:
  schedule:
    - cron: "23 * * * *"     # toda hora, no minuto 23 (horário UTC)
  workflow_dispatch:          # botão "Run workflow" para rodar na mão

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Coletar
        run: python astro.py coletar

      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "coleta $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
